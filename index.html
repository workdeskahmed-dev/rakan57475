<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Aroma Ladies Spa</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Cormorant+Garamond:wght@300;500;600&display=swap" rel="stylesheet">
<style>
/* ====== COLORS ====== */
:root{--bg:#15110e;--bg2:#261d18;--ch:#ead6b8;--rg:#c99a82;--wh:#f7eee4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0c0908;overflow:hidden;cursor:none}
#fit{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg);font-family:'Cairo',sans-serif;color:var(--wh)}
.sc{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,var(--bg2),var(--bg) 72%)}
.abs{position:absolute;left:0;width:100%;text-align:center}
.en{font-family:'Cormorant Garamond',serif;direction:ltr}
/* words: mask reveal */
.w{display:inline-block;overflow:hidden;padding:.22em .12em;margin:-.22em -.05em;vertical-align:top}
.w i{display:inline-block;font-style:normal;padding:0 .04em;opacity:0;transform:translateY(120%) rotate(5deg);filter:blur(14px)}
.on .w i{animation:up 1s var(--d) cubic-bezier(.2,1.25,.3,1) forwards}
.g i{background:linear-gradient(100deg,#b98069,#f4deC2 38%,#c99a82 60%,#f4dec2);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.on .g i{animation:up 1s var(--d) cubic-bezier(.2,1.25,.3,1) forwards,shim 3.5s linear infinite}
.on .trk .g i{animation:up 1.1s var(--d) cubic-bezier(.16,1,.3,1) forwards,trk 1.9s var(--d) cubic-bezier(.16,1,.3,1) forwards,shim 3.5s linear infinite}
.trk i{letter-spacing:.8em}
@keyframes up{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes trk{from{letter-spacing:.8em}to{letter-spacing:.05em}}
@keyframes shim{to{background-position:-220% 0}}
/* signature line */
.ln{height:2px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--ch),transparent);box-shadow:0 0 18px rgba(234,214,184,.6);transform:scaleX(0)}
.on .ln{animation:draw 1.1s var(--d) cubic-bezier(.7,0,.2,1) forwards}
@keyframes draw{to{transform:scaleX(1)}}
/* giant outline number */
.num{font:300 340px/1 'Cormorant Garamond',serif;direction:ltr;color:transparent;-webkit-text-stroke:2px var(--rg);opacity:0}
.on .num{animation:numin 1.5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes numin{from{opacity:0;transform:scale(1.7) translateY(60px);filter:blur(24px)}to{opacity:.95;transform:none;filter:blur(0)}}
/* animated frame */
.fr{position:absolute;inset:50px;width:980px;height:1820px}
.fr rect{fill:none;stroke:var(--ch);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1;opacity:.45}
.on .fr rect{animation:dash 2.2s .1s ease forwards}
@keyframes dash{to{stroke-dashoffset:0}}
/* orbs (option 4) */
.orb{position:absolute;left:50%;top:690px;border:1px solid var(--ch);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.2)}
.on .orb{animation:orb 2.6s var(--d) cubic-bezier(.16,1,.3,1) forwards}
@keyframes orb{to{opacity:.35;transform:translate(-50%,-50%) scale(1) rotate(60deg)}}
/* hook */
.cut{position:absolute;left:0;top:960px;width:100%;height:3px;background:var(--ch);box-shadow:0 0 30px 6px rgba(234,214,184,.7);transform:scaleX(0);opacity:1}
.on .cut{animation:cut 1s cubic-bezier(.8,0,.1,1) forwards}
@keyframes cut{0%{transform:scaleX(0)}30%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.ring{position:absolute;left:50%;top:960px;width:240px;height:240px;margin:-120px;border:2px solid var(--ch);border-radius:50%;opacity:0}
/* CTA numbers */
.nums{position:absolute;top:1420px;left:0;width:100%;display:flex;justify-content:center;gap:46px;direction:ltr}
.nn{font:300 130px/1 'Cormorant Garamond',serif;color:transparent;-webkit-text-stroke:1.6px var(--ch);opacity:0;transform:translateY(60px)}
.on .nn{animation:nn .9s var(--d) cubic-bezier(.16,1,.3,1) forwards,pl 1.2s calc(var(--d) + .9s) ease-in-out infinite}
@keyframes nn{to{opacity:1;transform:none}}
@keyframes pl{50%{-webkit-text-stroke-color:var(--rg);transform:translateY(-10px)}}
/* phone */
.ph{display:inline-block;direction:ltr;font:700 150px/1 'Cairo',sans-serif;letter-spacing:.05em;padding:26px 60px;border:2px solid rgba(234,214,184,.55);border-radius:200px;opacity:0;transform:scale(.8);filter:blur(10px);background:linear-gradient(100deg,#c99a82,#f4dec2,#c99a82);-webkit-background-clip:padding-box;color:var(--ch);box-shadow:0 0 60px rgba(201,154,130,.15)}
.on .ph{animation:phin 1.1s var(--d) cubic-bezier(.16,1,.3,1) forwards}
@keyframes phin{to{opacity:1;transform:none;filter:blur(0)}}
.ph{background:none}
/* logo */
#logo{position:absolute;left:0;top:0;width:470px;z-index:25;opacity:0;transition:transform 1.5s cubic-bezier(.65,0,.35,1),opacity 1s}
#logo img{width:100%;display:block;animation:fl 5s ease-in-out infinite,gl 3.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
@keyframes gl{0%,100%{filter:drop-shadow(0 0 16px rgba(201,154,130,.3))}50%{filter:drop-shadow(0 0 42px rgba(234,214,184,.6)) brightness(1.2)}}
/* progress */
#prog{position:absolute;bottom:110px;left:110px;right:110px;z-index:24;display:flex;gap:26px;direction:ltr;opacity:0;transition:opacity .6s}
.pi{flex:1;font:500 30px 'Cormorant Garamond',serif;color:var(--rg);opacity:.5;transition:opacity .5s}
.pi b{display:block;height:2px;margin-top:10px;background:rgba(234,214,184,.2);overflow:hidden;font-weight:400}
.pi b i{display:block;height:100%;background:var(--ch);transform:scaleX(0);transform-origin:left}
.pi.done,.pi.act{opacity:1}.pi.done b i{transform:scaleX(1)}.pi.act b i{animation:draw 3s linear forwards}
/* overlays */
#scan{position:absolute;top:0;left:0;width:3px;height:100%;z-index:22;opacity:0;background:linear-gradient(transparent,var(--ch),transparent);box-shadow:0 0 50px 8px rgba(234,214,184,.55)}
#flash{position:absolute;inset:0;z-index:23;background:#fff2df;opacity:0;pointer-events:none}
#fx{position:absolute;inset:0;z-index:10;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;z-index:29;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.6))}
#grain{position:absolute;inset:-120px;z-index:30;pointer-events:none;opacity:.1;animation:gr .5s steps(5) infinite;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
@keyframes gr{20%{transform:translate(-40px,30px)}40%{transform:translate(50px,-20px)}60%{transform:translate(-20px,-50px)}80%{transform:translate(30px,40px)}}
.heat .num{filter:url(#heat)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="heat"><feTurbulence type="fractalNoise" baseFrequency=".008 .02" numOctaves="2" result="t"><animate attributeName="baseFrequency" values=".008 .02;.014 .03;.008 .02" dur="4s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="26"/></filter></svg>
<div id="fit"><div id="stage">
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="scan"></div><div id="flash"></div>
  <div id="prog"></div>
  <div id="logo"><img src="logo.png" alt=""></div>
  <div id="vig"></div><div id="grain"></div>
</div></div>

<script>
/* ================= SETTINGS (edit here) ================= */
const CFG={phone:'0544450244',logo:'logo.png'};
const $=s=>document.querySelector(s),stage=$('#stage');
$('#logo img').src=CFG.logo;
/* word-mask helper: text, base delay(s), class */
const W=(t,b=0,c='')=>t.split(' ').map((w,i)=>`<span class="w ${c}"><i style="--d:${(b+i*.13).toFixed(2)}s">${w}</i></span>`).join(' ');
const FR='<svg class="fr" viewBox="0 0 980 1820"><rect x="1" y="1" width="978" height="1818" rx="46" pathLength="1"/></svg>';
const LN=(top,w,d)=>`<div class="abs" style="top:${top}px"><div class="ln" style="--d:${d}s;width:${w}px"></div></div>`;
/* ================= SCENES ================= */
const OPT=(n,q,name,extra='')=>FR+extra+
 `<div class="abs" style="top:78px;font-size:36px;font-weight:700;color:var(--rg)">${W('أي وصف أقرب لج؟',.2)}</div>
  <div class="abs num" style="top:500px">${n}</div>
  <div class="abs" style="top:890px;font-size:106px;font-weight:900;line-height:1.3;padding:0 60px">${W(q,.5)}</div>
  ${LN(1215,560,1.2)}
  <div class="abs en trk" style="top:1255px;font-size:112px;font-weight:600;padding:0 50px;line-height:1.1">${W(name,1.4,'g')}</div>`;
const S=[
 {t:0,m:'dust',l:[0,700,.5,-70,0,0],p:0,tr:null,fx:[[380,impact]],
  h:`<div class="cut"></div><div class="ring" id="rg"></div>
   <div class="abs" style="top:770px;font-size:180px;font-weight:900;line-height:1.2;padding:0 40px">${W('جاوبي بسرعة…',.5,'g')}</div>${LN(1120,660,1.1)}`},
 {t:2,m:'dust',l:[0,300,1,0,0,1],p:0,tr:'expand',fx:[[200,flash]],
  h:`${FR}<div class="abs" style="top:650px;font-size:146px;font-weight:900;line-height:1.35">${W('أي وحدة فيهم',.3)}<br>${W('تحسينها',.6)} ${W('تمثلج؟',.75,'g')}</div>${LN(1240,700,1.2)}`},
 {t:4,m:'dust',l:[-210,300,1,14,-3,1],p:1,tr:'inset',h:OPT('01','جسمج مرهق؟','Regular Massage')},
 {t:7,m:'embers',l:[210,290,1.03,-14,3,1],p:2,tr:'circle',cls:'heat',h:OPT('02','تحسين بثقل وتوتر؟','Hot Stone Massage')},
 {t:10,m:'flow',l:[-190,300,1.05,12,-3,1],p:3,tr:'diag',h:OPT('03','تحتاجين استرخاء ودفء؟','Thai Herbal Massage')},
 {t:13,m:'grain',l:[210,300,1.03,-12,3,1],p:4,tr:'expand',
  h:OPT('04','جسمج يحتاج عناية وانتعاش؟','Body Scrub',
   [900,720,540].map((s,i)=>`<div class="orb" style="width:${s}px;height:${s}px;--d:${.2+i*.25}s;${i==1?'border-style:dashed;':''}"></div>`).join(''))},
 {t:16,m:'dust',l:[0,300,1.1,0,0,1],p:0,tr:'inset',fx:[[900,flash]],
  h:`${FR}<div class="abs" style="top:660px;font-size:200px;font-weight:900;line-height:1.2">${W('اختاري رقم…',.25,'g')}</div>${LN(1000,640,1.1)}
   <div class="abs" style="top:1080px;font-size:88px;font-weight:700">${W('وشوفي أي تجربة تناسبج',.9)}</div>
   <div class="nums">${['01','02','03','04'].map((n,i)=>`<div class="nn" style="--d:${1.2+i*.15}s">${n}</div>`).join('')}</div>`},
 {t:18,m:'dust',l:[0,510,1.5,0,0,1],p:0,tr:'circle',fx:[[200,flash]],
  h:`${FR}<div class="abs en" style="top:800px;font-size:112px;font-weight:600;line-height:1.1">${W('Aroma Ladies Spa',.5,'g')}</div>${LN(950,560,1)}
   <div class="abs" style="top:1010px;font-size:72px;font-weight:700;line-height:1.55;padding:0 60px">${W('اكتبي رقم 1، 2، 3 أو 4',1.1)}<br>${W('بالتعليقات',1.4,'g')}</div>
   <div class="abs" style="top:1400px"><div class="ph" style="--d:1.8s">${CFG.phone}</div></div>`}
];
/* transitions (clip-path) */
const TR={inset:['inset(50% 0 50% 0)','inset(0% 0 0% 0)'],circle:['circle(0% at 50% 50%)','circle(120% at 50% 50%)'],
 diag:['polygon(0 0,0 0,-60% 100%,-60% 100%)','polygon(0 0,160% 0,100% 100%,-60% 100%)'],
 expand:['inset(36% 26% 36% 26% round 420px)','inset(0% 0% 0% 0% round 0px)']};
/* ================= EFFECTS ================= */
function impact(){stage.animate([{transform:'none'},{transform:'translate(-16px,12px) scale(1.025)'},{transform:'translate(12px,-10px)'},{transform:'translate(-6px,4px)'},{transform:'none'}],{duration:520,easing:'ease-out'});
 flash(.55);$('#rg').animate([{opacity:.9,transform:'scale(.2)'},{opacity:0,transform:'scale(9)'}],{duration:1400,easing:'cubic-bezier(.1,.8,.2,1)'})}
function flash(a=.3){$('#flash').animate([{opacity:a},{opacity:0}],{duration:600,easing:'ease-out'})}
let dir=0;function scan(){dir^=1;const e=$('#scan');e.animate([{opacity:1,transform:`translateX(${dir?0:1080}px)`},{opacity:0,transform:`translateX(${dir?1080:0}px)`}],{duration:850,easing:'cubic-bezier(.7,0,.2,1)'})}
function pose([x,y,s,ry,rz,o]){const l=$('#logo');l.style.transform=`perspective(1400px) translate(${540-235+x}px,${y-132}px) scale(${s}) rotateY(${ry}deg) rotate(${rz}deg)`;l.style.opacity=o}
const prog=$('#prog');prog.innerHTML=[1,2,3,4].map(n=>`<div class="pi">0${n}<b><i></i></b></div>`).join('');
function setProg(n){prog.style.opacity=n?1:0;[...prog.children].forEach((e,i)=>{e.className='pi'+(i+1<n?' done':i+1==n?' act':'')})}
let prev=null,mode='dust';
function go(i){const s=S[i],el=document.createElement('div');el.className='sc '+(s.cls||'');el.innerHTML=s.h;stage.insertBefore(el,$('#fx'));
 if(s.tr){el.animate({clipPath:TR[s.tr]},{duration:950,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});scan()}
 requestAnimationFrame(()=>el.classList.add('on'));
 if(prev){const o=prev;setTimeout(()=>o.remove(),1100)}prev=el;
 mode=s.m;pose(s.l);setProg(s.p);(s.fx||[]).forEach(([d,f])=>setTimeout(f,d))}
/* ================= PARTICLES ================= */
const cx=$('#fx').getContext('2d');
const P=Array.from({length:90},()=>({x:Math.random()*1080,y:Math.random()*1920,r:Math.random()*2.6+.7,s:Math.random()*.7+.25,a:Math.random()*6.28}));
function wave(t,k,col,base,amp,f){cx.beginPath();for(let x=0;x<=1080;x+=24){const y=base+Math.sin(x/f+t*.8+k*.7)*amp+Math.sin(x/70+t+k)*14;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.strokeStyle=col;cx.lineWidth=1.5;cx.stroke()}
function frame(now){const t=now/1000;cx.clearRect(0,0,1080,1920);
 if(mode=='flow')for(let k=0;k<9;k++)wave(t,k,`rgba(234,214,184,${.07+k*.012})`,1000+k*45-200,90+k*14,170);
 if(mode=='grain')for(let k=0;k<5;k++)wave(t,k,`rgba(201,154,130,${.1+k*.03})`,1450+k*50,50+k*8,140);
 if(mode=='embers')for(let k=0;k<4;k++)wave(t,k,`rgba(230,160,110,${.08+k*.03})`,1500+k*40,22,90);
 for(const p of P){let x=p.x,y=p.y,c='234,214,184',r=p.r,a=.55;
  if(mode=='embers'){p.y-=p.s*2.4;p.x+=Math.sin(t*2+p.a)*.8;c='236,166,118';r*=1.4}
  else if(mode=='grain'){p.a+=.0025*p.s;const R=240+p.s*420;x=540+Math.cos(p.a)*R;y=700+Math.sin(p.a)*R*.7;r*=1.6;c='224,190,160'}
  else if(mode=='flow'){p.x+=p.s*1.6;p.y+=Math.sin(t+p.a)*.6}
  else p.y-=p.s*.5;
  if(p.y<-20)p.y=1940;if(p.x>1100)p.x=-20;
  x=mode=='grain'?x:p.x;y=mode=='grain'?y:p.y;
  cx.fillStyle=`rgba(${c},${a*(.5+.5*Math.sin(t*1.5+p.a))})`;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();
  cx.fillStyle=`rgba(${c},.07)`;cx.beginPath();cx.arc(x,y,r*5,0,6.283);cx.fill()}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
/* ================= FIT + START ================= */
function fit(){$('#fit').style.transform=`scale(${Math.min(innerWidth/1080,innerHeight/1920)})`}
addEventListener('resize',fit);fit();
function start(){const t0=performance.now();S.forEach((s,i)=>setTimeout(()=>go(i),Math.max(0,s.t*1000-(performance.now()-t0))))}
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1800))]).then(()=>setTimeout(start,300));
</script>
</body>
</html>
